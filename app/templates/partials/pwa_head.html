  <link rel="manifest" href="{{ url_for('mobile.manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('mobile.apple_icon') }}">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ brand_name }}">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // home-screen app: offline page when the workshop PC can't be reached (needs a trusted https page)
    if ("serviceWorker" in navigator && window.isSecureContext) {
      addEventListener("load", function () { navigator.serviceWorker.register("{{ url_for('mobile.service_worker') }}", { scope: "/" }).catch(function () {}); });
    }
  </script>
