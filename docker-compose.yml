services:
  erp:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    # phones (microphone, home-screen app): serve https with the shop certificate on 8443,
    # the phone set-up page stays on 8080. Also set ERP_LAN_IP below.
    # command: ["python", "run.py", "--https"]
    environment:
      # the assistant talks to the ollama service below; the model is downloaded on first start
      ERP_ASSISTANT_BASE_URL: http://ollama:11434/v1
      # this server's address in the shop network (the container can't see it), for QR codes & certificate
      # ERP_LAN_IP: 192.168.1.20
    volumes:
      # everything the app stores lives here: database, invoice XML, backups, secret key
      - ./data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama  # downloaded models
